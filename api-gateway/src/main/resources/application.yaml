server:
  port: 8000
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      server:
        webmvc:
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/auth/**,/api/users/**
            - id: wallet-service
              uri: lb://WALLET-SERVICE
              predicates:
                - Path=/api/wallet/**
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/order/**
            - id: market-data-service
              uri: lb://MARKET-DATA-SERVICE
              predicates:
                - Path=/api/klines/**,/api/price/**
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
logging:
  level:
    org:
      springframework:
        cloud.gateway: TRACE
        web.servlet.function: TRACE
        security: DEBUG

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
management:
  endpoints:
    web:
      exposure:
        include: gateway
jwt:
  signerKey: ${JWT_SIGNER_KEY}
