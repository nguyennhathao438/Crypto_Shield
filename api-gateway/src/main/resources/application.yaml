server:
  port: 8000
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      server:
        webmvc:
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/auth/**,/api/users/**
            - id: wallet-service
              uri: lb://WALLET-SERVICE
              predicates:
                - Path=/api/wallets/**
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/orders/**
  data:
    redis:
      host: localhost
      port: 6379
logging:
  level:
    org:
      springframework:
        cloud.gateway: TRACE
        web.servlet.function: TRACE
        security: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: gateway
jwt:
  signerKey: ${JWT_SIGNER_KEY}
